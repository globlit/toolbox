# OPTIONAL: adds explicit cluster-scope visibility. Review before applying;
# also set allow_cluster_scoped=true in the operator-owned toolbox config.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toolbox-cluster-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes, ciliumclusterwidenetworkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toolbox-cluster-reader
subjects:
  - kind: ServiceAccount
    name: toolbox-reader
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toolbox-cluster-reader
